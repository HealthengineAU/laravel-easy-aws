version: 2
updates:
- assignees:
    - tspencer244
  directory: /
  groups:
    composer-minor-patch:
      update-types:
        - minor
        - patch
  open-pull-requests-limit: 3
  package-ecosystem: composer
  pull-request-branch-name:
    separator: '-'
  rebase-strategy: disabled
  reviewers:
    - tspencer244
  schedule:
    interval: daily
    time: '15:00'
    timezone: Australia/Perth
